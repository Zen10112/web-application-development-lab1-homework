<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit Engine - Contract First</title>
    <!-- CSS cơ bản hoặc liên kết file CSS, không chứa JavaScript -->
</head>
<body>
    <header>
        <h1>Drum Kit Engine</h1>
        <p>Giao ước dữ liệu âm thanh (Contract-First)</p>
    </header>

    <main id="main-content">
        <!-- Khu vực bảng điều khiển âm thanh (Drum Pads) định nghĩa qua HTML data-* contract -->
        <section class="drum-kit-container">
            <div class="drum-pads" role="region" aria-label="Bảng điều khiển trống">
                <!-- Nút 1: Kick -->
                <button type="button" class="drum-pad" data-key="KeyA" data-sound="kick">
                    <span class="sound-name">Kick</span>
                    <kbd class="key-shortcut">A</kbd>
                </button>

                <!-- Nút 2: Snare -->
                <button type="button" class="drum-pad" data-key="KeyS" data-sound="snare">
                    <span class="sound-name">Snare</span>
                    <kbd class="key-shortcut">S</kbd>
                </button>

                <!-- Nút 3: Hi-Hat Closed -->
                <button type="button" class="drum-pad" data-key="KeyD" data-sound="hihat-closed">
                    <span class="sound-name">Hi-Hat Closed</span>
                    <kbd class="key-shortcut">D</kbd>
                </button>

                <!-- Nút 4: Hi-Hat Open -->
                <button type="button" class="drum-pad" data-key="KeyF" data-sound="hihat-open">
                    <span class="sound-name">Hi-Hat Open</span>
                    <kbd class="key-shortcut">F</kbd>
                </button>

                <!-- Nút 5: Tom -->
                <button type="button" class="drum-pad" data-key="KeyG" data-sound="tom">
                    <span class="sound-name">Tom</span>
                    <kbd class="key-shortcut">G</kbd>
                </button>

                <!-- Nút 6: Clap -->
                <button type="button" class="drum-pad" data-key="KeyH" data-sound="clap">
                    <span class="sound-name">Clap</span>
                    <kbd class="key-shortcut">H</kbd>
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Drum Kit Engine. Contract established.</p>
    </footer>
</body>
</html>
