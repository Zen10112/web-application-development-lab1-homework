<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW3: State-Machine Form & Security</title>
    <!-- Liên kết file CSS định dạng -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Resilient Form Module</h1>
    </header>

    <main id="main-content">
        <section id="form-section">
            <h2>Đăng ký nhận thông tin</h2>
            
            <!-- State-Machine Form: Khởi tạo ở trạng thái idle, tích hợp bảo mật -->
            <form id="state-machine-form" data-state="idle">
                <div class="form-group">
                    <label for="email">Địa chỉ Email:</label>
                    <input type="email" id="email" name="email" required placeholder="nhap@email.com">
                </div>
                
                <!-- Nút submit tự động khóa khi chuyển sang trạng thái Submitting (Chống Double-submit) -->
                <button type="submit" id="submit-btn">Gửi đăng ký</button>
                
                <!-- Vùng chứa thông báo trạng thái, cập nhật bằng textContent để chống XSS -->
                <div id="form-message" aria-live="polite"></div>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Resilient Event Hub. All rights reserved.</p>
    </footer>

    <!-- Liên kết module JavaScript điều phối form -->
    <script type="module" src="form-main.js"></script>
</body>
</html>
